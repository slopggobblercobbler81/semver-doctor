[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semver-doctor"
version = "0.1.0"
description = "Production-grade Semantic Versioning (SemVer 2.0.0) linter, git tag doctor, and release bumper."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "slopggobblercobbler81" }
]
keywords = ["semver", "versioning", "linter", "git", "tags", "release", "conventional-commits", "cli", "devops"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
semver-doctor = "semver_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/slopggobblercobbler81/semver-doctor"
Repository = "https://github.com/slopggobblercobbler81/semver-doctor"
Issues = "https://github.com/slopggobblercobbler81/semver-doctor/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["semver_doctor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
